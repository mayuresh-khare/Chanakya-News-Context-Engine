<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHANAKYA - History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <button id="theme-toggle-btn" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
            <div class="brand-mark">
                <span class="glyph">📜</span>
                <h1>CHANAKYA</h1>
            </div>
            <p class="tagline">Analysis History</p>
        </header>

        <nav>
            <a href="{{ url_for('index') }}">Analyze</a>
            <a href="{{ url_for('history') }}" class="active">History</a>
        </nav>

        <main>
            {% if analyses %}
                <ul class="history-list">
                    {% for item in analyses %}
                        <li>
                            <a href="{{ url_for('view_result', analysis_id=item.id) }}">
                                <span class="history-preview">{{ item.preview }}</span>
                                <span class="history-date">{{ item.created_at }}</span>
                            </a>
                        </li>
                    {% endfor %}
                </ul>
            {% else %}
                <p class="muted">No articles analyzed yet. <a href="{{ url_for('index') }}">Analyze your first one.</a></p>
            {% endif %}
        </main>

        <footer>
            <p>CHANAKYA &mdash; NLP Mini Project</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>
